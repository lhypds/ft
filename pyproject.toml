[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ft"
version = "0.1.0"
description = "CLI to fetch, summarize, and search text from the web"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "trafilatura>=1.8.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.40.0",
]

[project.scripts]
ft = "ft.cli:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["ft*"]
